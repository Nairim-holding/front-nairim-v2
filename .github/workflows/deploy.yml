name: Deploy Automatico Hostinger

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executando deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USERNAME }}
          key: ${{ secrets.HOST_SSH_KEY_2 }}
          port: 22
          script: |
            set -e
            cd /var/www/front-nairim-v2

            git fetch origin main
            git reset --hard origin/main

            # Compila e inicia um por vez sequencialmente (evita travamento do servidor)
            # Removemos o "docker compose down" geral para que o site não fique fora do ar 
            # durante todo o tempo de build. Cada container só será recriado no momento final.
            docker compose up -d --build front-nairim
            docker compose up -d --build front-nairim-test
            docker compose up -d --build front-nairim-homolog