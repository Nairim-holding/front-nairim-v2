name: Deploy iholding

on:
  push:
    branches: [iholding]
  workflow_dispatch:

concurrency:
  group: iholding-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  imagem:
    if: github.ref == 'refs/heads/iholding'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: front
            target: runner
          - name: operations
            target: operations
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/iholding/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nairim-holding/front-nairim-v2:iholding-${{ matrix.name }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_URL_API=https://iholding.com.br/api
            NEXT_PUBLIC_COMPANY_SLUG=iholding
            NEXT_PUBLIC_COMPANY_NAME=I Holding
            NEXT_PUBLIC_CARTO_API_KEY=${{ vars.NEXT_PUBLIC_CARTO_API_KEY }}
          cache-from: type=gha,scope=iholding-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=iholding-${{ matrix.name }}

  deploy:
    needs: imagem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Atualizar somente a iholding na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USERNAME }}
          key: ${{ secrets.HOST_SSH_KEY_2 }}
          port: 22
          command_timeout: 15m
          envs: DEPLOY_SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd /var/www/iholding
            test "$(git branch --show-current)" = iholding
            git diff --quiet
            git diff --cached --quiet
            git fetch origin iholding
            git merge --ff-only "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            bash deploy/iholding/deploy-images.sh
