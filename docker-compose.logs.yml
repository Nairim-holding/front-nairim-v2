services:
  # Produção tem instância, volume e credencial exclusivos: backup, restore,
  # queda ou reset de teste/homologação nunca alcançam o histórico real.
  mongodb-logs-prod:
    image: mongo:8.0
    container_name: nairim-mongodb-logs-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_LOGS_USER:?Configure MONGODB_LOGS_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_LOGS_PASSWORD:?Configure MONGODB_LOGS_PASSWORD}
    ports:
      - "127.0.0.1:${MONGODB_LOGS_PORT:-27018}:27017"
    volumes:
      - mongodb_logs_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Instância compartilhada por teste e homologação, separados por database.
  # Só sobe com --profile test ou --profile homolog.
  mongodb-logs-staging:
    profiles: ["test", "homolog"]
    image: mongo:8.0
    container_name: nairim-mongodb-logs-staging
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_LOGS_STAGING_USER:-nairim_logs}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_LOGS_STAGING_PASSWORD:?Configure MONGODB_LOGS_STAGING_PASSWORD}
    ports:
      - "127.0.0.1:${MONGODB_LOGS_STAGING_PORT:-27019}:27017"
    volumes:
      - mongodb_logs_staging_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Um serviço de transferência por PostgreSQL: cada ambiente tem a sua própria
  # fila AuditLogOutbox e o worker só lê o banco apontado em DATABASE_URL.
  logs-worker:
    build:
      context: .
      dockerfile: worker/logs/Dockerfile
    container_name: nairim-logs-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      DATABASE_URL: ${LOGS_WORKER_DATABASE_URL:?Configure LOGS_WORKER_DATABASE_URL}
      MONGODB_LOGS_URI: mongodb://${MONGODB_LOGS_USER}:${MONGODB_LOGS_PASSWORD}@mongodb-logs-prod:27017/?authSource=admin
    depends_on:
      mongodb-logs-prod:
        condition: service_healthy

  logs-worker-test:
    # Perfil próprio: só sobe com --profile test, para que um ambiente sem
    # teste configurado continue subindo normalmente.
    profiles: ["test"]
    build:
      context: .
      dockerfile: worker/logs/Dockerfile
    container_name: nairim-logs-worker-test
    restart: unless-stopped
    env_file:
      - path: .env.test
        required: false
    environment:
      DATABASE_URL: ${LOGS_WORKER_TEST_DATABASE_URL:-}
      MONGODB_LOGS_URI: mongodb://${MONGODB_LOGS_STAGING_USER:-nairim_logs}:${MONGODB_LOGS_STAGING_PASSWORD}@mongodb-logs-staging:27017/?authSource=admin
      MONGODB_LOGS_DATABASE: ${MONGODB_LOGS_TEST_DATABASE:-nairim_logs_test}
    depends_on:
      mongodb-logs-staging:
        condition: service_healthy

  logs-worker-homolog:
    profiles: ["homolog"]
    build:
      context: .
      dockerfile: worker/logs/Dockerfile
    container_name: nairim-logs-worker-homolog
    restart: unless-stopped
    env_file:
      - path: .env.homolog
        required: false
    environment:
      DATABASE_URL: ${LOGS_WORKER_HOMOLOG_DATABASE_URL:-}
      MONGODB_LOGS_URI: mongodb://${MONGODB_LOGS_STAGING_USER:-nairim_logs}:${MONGODB_LOGS_STAGING_PASSWORD}@mongodb-logs-staging:27017/?authSource=admin
      MONGODB_LOGS_DATABASE: ${MONGODB_LOGS_HOMOLOG_DATABASE:-nairim_logs_homolog}
    depends_on:
      mongodb-logs-staging:
        condition: service_healthy
volumes:
  # Mantém o nome do volume já existente na VPS: renomear o serviço não move
  # dados, e o histórico de produção já migrado continua onde está.
  mongodb_logs_prod_data:
    name: nairim_mongodb_logs_data
  mongodb_logs_staging_data:
    name: nairim_mongodb_logs_staging_data
